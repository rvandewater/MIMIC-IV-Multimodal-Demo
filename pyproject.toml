[build-system]
requires = ["hatchling>=1.18", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "Multi-MIMIC"   # PyPI normalizes it to multi-mimic
dynamic = ["version"]   # from the git tag (hatch-vcs): tag v0.0.1 builds version 0.0.1
description = "Assemble a local multimodal MIMIC-IV demo: the 100 demo patients across EHR, ECG, ICU waveforms, chest X-ray, echo and notes"
readme = "README.md"
requires-python = ">=3.10"   # as the physionet package
authors = [{ name = "Robin van de Water" }]
keywords = ["MIMIC-IV", "PhysioNet", "multimodal", "electronic health records", "ECG", "waveforms",
            "chest X-ray", "echocardiography", "clinical notes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["physionet>=0.3.0", "requests>=2.28", "tqdm>=4.60"]

[project.urls]
Homepage = "https://github.com/rvandewater/Multi-MIMIC"
Issues = "https://github.com/rvandewater/Multi-MIMIC/issues"

[project.scripts]
multi-mimic = "multi_mimic.cli:main"

[project.optional-dependencies]
test = ["pytest>=7", "matplotlib>=3.6"]
figure = ["matplotlib>=3.6"]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"   # a checkout without git history

[tool.hatch.build.targets.wheel]
packages = ["src/multi_mimic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
